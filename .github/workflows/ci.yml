name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workflow: [imagery, elevation]
    defaults:
      run:
        working-directory: ${{ matrix.workflow }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-local-path: ${{ matrix.workflow }}/.cache/uv
          cache-dependency-glob: ${{ matrix.workflow }}/uv.lock

      - name: Install GDAL and PROJ command-line tools
        if: matrix.workflow == 'imagery'
        run: sudo apt-get update && sudo apt-get install --yes gdal-bin proj-bin

      - name: Install dependencies
        run: UV_CACHE_DIR=.cache/uv uv sync --frozen --all-groups

      - name: Run checks
        run: |
          UV_CACHE_DIR=.cache/uv uv run --frozen ruff check src tests examples
          UV_CACHE_DIR=.cache/uv uv run --frozen ruff format --check src tests examples
          UV_CACHE_DIR=.cache/uv uv run --frozen pytest

      - name: Run the standalone synthetic example
        run: UV_CACHE_DIR=.cache/uv uv run --frozen python examples/synthetic.py "${{ runner.temp }}/surface-${{ matrix.workflow }}"

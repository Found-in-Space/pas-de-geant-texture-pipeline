name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-local-path: .cache/uv

      - name: Install GDAL and PROJ command-line tools
        run: sudo apt-get update && sudo apt-get install --yes gdal-bin proj-bin

      - name: Install dependencies
        run: UV_CACHE_DIR=.cache/uv uv sync --all-groups

      - name: Run checks
        run: |
          UV_CACHE_DIR=.cache/uv uv run ruff check src tests
          UV_CACHE_DIR=.cache/uv uv run ruff format --check src tests
          UV_CACHE_DIR=.cache/uv uv run pytest --cov-report=xml --cov-report=term-missing

      - name: Upload coverage XML
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "found-in-space-pas-de-geant-texture-pipeline"
version = "0.1.0"
description = "Reproducible planetary display-texture production for Found in Space's Pas de Géant."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
]

[project.urls]
Homepage = "https://foundin.space/"

[project.scripts]
pas-de-geant-textures = "foundinspace.textures.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/foundinspace"]

[dependency-groups]
dev = [
  "pre-commit>=4",
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.15",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "--cov=foundinspace --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
